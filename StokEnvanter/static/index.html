<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok | Envanter</title><link rel="stylesheet" href="/style.css"></head><body><header>STOK<span> / ENVANTER</span><small>Yerel işletme paneli</small></header><main><h1>Envanter yönetimi</h1><p>Ürün kayıtlarınızı tek bir noktadan yönetin.</p><section class="stats"><article>Ürün çeşidi<strong id="count">—</strong></article><article>Toplam stok<strong id="stock">—</strong></article><article>Envanter değeri<strong id="value">—</strong></article><article>Kritik stok (≤ 10)<strong id="low-count">—</strong></article></section><section class="panel"><h2>Yeni ürün</h2><form id="form"><label>Ürün kodu<input name="code" required maxlength="120" placeholder="URN-001"></label><label>Ürün adı<input name="name" required maxlength="120" placeholder="Kablosuz fare"></label><label>Kategori<input name="category" required maxlength="120" placeholder="Elektronik"></label><label>Birim fiyat (₺)<input name="price" type="number" min="0" max="100000000" step="0.01" required></label><label>Stok miktarı<input name="stock" type="number" min="0" max="100000000" step="1" required></label><button>Ürün ekle</button></form><p id="message" role="status"></p></section><section class="panel"><h2>Ürün listesi</h2>
<div class="filters">
<label>Ürün ara<input id="search" type="search" placeholder="Ürün adı veya kodu"></label>
<label>Kategori<select id="category-filter"><option value="">Tüm kategoriler</option></select></label>
<label>Stok durumu<select id="status-filter"><option value="">Tüm durumlar</option><option value="ok">Yeterli</option><option value="low">Kritik stok</option><option value="empty">Stok tükendi</option></select></label>
<button id="clear-filters" type="button">Filtreleri temizle</button>
</div><p id="result-count" role="status"></p><div class="scroll"><table><thead><tr><th>Kod</th><th>Ürün</th><th>Kategori</th><th>Birim fiyat</th><th>Stok</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty"></p></section></main><script src="/app.js"></script></body></html>
