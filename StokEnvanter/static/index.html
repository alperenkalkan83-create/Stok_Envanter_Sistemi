<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok | Envanter</title><link rel="stylesheet" href="/style.css"></head><body><header>STOK<span> / ENVANTER</span><small>Yerel işletme paneli</small></header><main><h1>Envanter yönetimi</h1><p>Ürün kayıtlarınızı tek bir noktadan yönetin.</p><section class="stats"><article>Ürün çeşidi<strong id="count">—</strong></article><article>Toplam stok<strong id="stock">—</strong></article><article>Envanter değeri<strong id="value">—</strong></article></section><section class="panel"><h2>Yeni ürün</h2><form id="form"><label>Ürün kodu<input name="code" required maxlength="120" placeholder="URN-001"></label><label>Ürün adı<input name="name" required maxlength="120" placeholder="Kablosuz fare"></label><label>Kategori<input name="category" required maxlength="120" placeholder="Elektronik"></label><label>Birim fiyat (₺)<input name="price" type="number" min="0" max="100000000" step="0.01" required></label><label>Stok miktarı<input name="stock" type="number" min="0" max="100000000" step="1" required></label><button>Ürün ekle</button></form><p id="message" role="status"></p></section><section class="panel"><h2>Ürün listesi</h2><div class="scroll"><table><thead><tr><th>Kod</th><th>Ürün</th><th>Kategori</th><th>Birim fiyat</th><th>Stok</th><th>İşlemler</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty"></p></section></main><script src="/app.js"></script></body></html>
